<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PadelMatch</title>
<meta name="description" content="Padel-Spiele eintragen und Mitspieler finden">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0093A8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PadelMatch">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');

  #padelmatch-root {
    --court: #0093A8;
    --court-dark: #005A66;
    --court-bright: #00C2D6;
    --clay: #FF5A36;
    --clay-dark: #E23F1C;
    --chalk: #F3FAFB;
    --card: #FFFFFF;
    --line: #FFFFFF;
    --ball: #DFFF3D;
    --ink: #06262C;
    --ink-soft: #3D6068;
    --danger: #E2314B;

    background: var(--chalk);
    color: var(--ink);
    font-family: 'Manrope', sans-serif;
    min-height: 100%;
    padding: 0 0 64px 0;
    box-sizing: border-box;
  }
  #padelmatch-root *, #padelmatch-root *::before, #padelmatch-root *::after {
    box-sizing: border-box;
  }

  .pm-display {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    letter-spacing: 0.01em;
    text-transform: uppercase;
  }
  .pm-mono {
    font-family: 'JetBrains Mono', monospace;
  }

  /* ---------- Hero ---------- */
  .pm-hero {
    background:
      radial-gradient(circle at 88% -10%, rgba(223,255,61,0.35) 0%, rgba(223,255,61,0) 42%),
      radial-gradient(circle at 6px 6px, rgba(255,255,255,0.16) 2px, transparent 2.6px),
      linear-gradient(155deg, var(--court-bright) 0%, var(--court) 45%, var(--court-dark) 100%);
    background-size: auto, 26px 26px, auto;
    color: var(--chalk);
    padding: 48px 24px 40px;
    position: relative;
    overflow: hidden;
    border-bottom: 6px solid var(--ball);
  }
  .pm-hero-inner {
    max-width: 720px;
    margin: 0 auto;
    position: relative;
    z-index: 2;
  }
  .pm-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--court-dark);
    background: var(--ball);
    display: inline-block;
    padding: 5px 12px;
    border-radius: 100px;
    margin: 0 0 16px 0;
    opacity: 0;
    animation: pmFadeUp 0.6s ease-out 0.05s forwards;
  }
  .pm-headline {
    font-size: clamp(42px, 9vw, 70px);
    line-height: 0.9;
    margin: 0 0 18px 0;
    color: #fff;
    text-shadow: 4px 4px 0 var(--clay), 4px 4px 0 1px var(--ink);
    -webkit-text-stroke: 1.5px var(--ink);
    opacity: 0;
    animation: pmFadeUp 0.6s ease-out 0.15s forwards;
  }
  .pm-net {
    display: flex;
    align-items: center;
    gap: 4px;
    margin: 0 0 18px 0;
    opacity: 0;
    animation: pmFadeUp 0.6s ease-out 0.25s forwards;
  }
  .pm-net span {
    width: 7px;
    height: 24px;
    background: rgba(255,255,255,0.4);
    border-radius: 1px;
  }
  .pm-net span:nth-child(4n) { background: var(--ball); height: 30px; }
  .pm-net span:nth-child(3n) { background: var(--clay); }
  .pm-sub {
    font-size: 16px;
    font-weight: 500;
    line-height: 1.5;
    max-width: 46ch;
    color: rgba(255,255,255,0.92);
    margin: 0 0 26px 0;
    opacity: 0;
    animation: pmFadeUp 0.6s ease-out 0.35s forwards;
  }
  .pm-cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--ball);
    color: var(--ink);
    border: 2.5px solid var(--ink);
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: 15px;
    padding: 13px 22px;
    border-radius: 100px;
    cursor: pointer;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    opacity: 0;
    animation: pmFadeUp 0.6s ease-out 0.45s forwards;
  }
  .pm-cta:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
  .pm-cta:active { transform: translate(1px, 1px); box-shadow: 2px 2px 0 var(--ink); }
  .pm-cta:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  @keyframes pmFadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* decorative court lines in hero background */
  .pm-hero-lines {
    position: absolute; inset: 0; z-index: 1; opacity: 0.5; pointer-events: none;
  }

  /* ---------- Name bar ---------- */
  .pm-namebar {
    max-width: 720px;
    margin: -22px auto 0;
    padding: 0 24px;
    position: relative;
    z-index: 3;
  }
  .pm-namebar-inner {
    background: var(--card);
    border: 2.5px solid var(--ink);
    border-radius: 14px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 4px 4px 0 var(--clay);
  }
  .pm-namebar label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--court);
    white-space: nowrap;
  }
  .pm-namebar input {
    flex: 1;
    border: none;
    background: transparent;
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--ink);
    outline: none;
    min-width: 0;
  }

  /* ---------- Main container ---------- */
  .pm-main { max-width: 720px; margin: 0 auto; padding: 28px 24px 0; }

  /* ---------- Create form ---------- */
  .pm-form-wrap {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease;
  }
  .pm-form-wrap.pm-open { max-height: 900px; }
  .pm-form {
    background: var(--card);
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 26px;
    box-shadow: 5px 5px 0 var(--court);
    border: 2.5px solid var(--ink);
  }
  .pm-form h2 {
    font-family: 'Anton', sans-serif;
    font-size: 24px;
    text-transform: uppercase;
    margin: 0 0 16px 0;
    color: var(--clay);
  }
  .pm-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .pm-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .pm-field.pm-full { grid-column: 1 / -1; }
  .pm-field label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .pm-field input, .pm-field select, .pm-field textarea {
    font-family: 'Manrope', sans-serif;
    font-weight: 600;
    font-size: 15px;
    padding: 10px 12px;
    border: 2px solid #C9DEE2;
    border-radius: 9px;
    background: var(--chalk);
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease;
  }
  .pm-field input:focus, .pm-field select:focus, .pm-field textarea:focus {
    border-color: var(--court);
  }
  .pm-field textarea { resize: vertical; min-height: 56px; font-family: 'Manrope', sans-serif; }

  .pm-level-picker { display: flex; gap: 8px; flex-wrap: wrap; }
  .pm-level-opt {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 12px;
    padding: 8px 13px;
    border-radius: 100px;
    border: 2px solid var(--ink);
    background: var(--chalk);
    cursor: pointer;
    color: var(--ink);
    user-select: none;
  }
  .pm-level-opt.pm-active {
    background: var(--ball);
    border-color: var(--ink);
    color: var(--ink);
    box-shadow: 2px 2px 0 var(--ink);
  }

  .pm-form-actions { display: flex; gap: 10px; margin-top: 6px; }
  .pm-btn-primary {
    background: var(--clay);
    color: #fff;
    border: 2.5px solid var(--ink);
    font-weight: 800;
    font-size: 14px;
    padding: 11px 20px;
    border-radius: 100px;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
    transition: background 0.15s ease, transform 0.12s ease, box-shadow 0.12s ease;
  }
  .pm-btn-primary:hover { background: var(--clay-dark); transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--ink); }
  .pm-btn-ghost {
    background: transparent;
    color: var(--ink);
    border: 2px solid var(--ink);
    font-weight: 700;
    font-size: 14px;
    padding: 11px 20px;
    border-radius: 100px;
    cursor: pointer;
  }
  .pm-error {
    color: var(--danger);
    font-size: 13px;
    margin: 0 0 10px 0;
    font-weight: 600;
  }

  /* ---------- Filters ---------- */
  .pm-filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .pm-chip {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 12px;
    padding: 7px 14px;
    border-radius: 100px;
    border: 2px solid var(--ink);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
  }
  .pm-chip.pm-active {
    background: var(--court);
    border-color: var(--ink);
    color: #fff;
    box-shadow: 2px 2px 0 var(--ink);
  }

  /* ---------- Game cards ---------- */
  .pm-list { display: flex; flex-direction: column; gap: 14px; }
  .pm-card {
    background: var(--card);
    border-radius: 16px;
    padding: 18px;
    display: flex;
    gap: 16px;
    box-shadow: 4px 4px 0 var(--court);
    border: 2.5px solid var(--ink);
    opacity: 0;
    animation: pmFadeUp 0.4s ease-out forwards;
  }
  .pm-card.pm-full-game { opacity: 0.72; box-shadow: 4px 4px 0 #C9DEE2; }
  .pm-court-svg { flex-shrink: 0; width: 84px; height: 108px; }
  .pm-card-body { flex: 1; min-width: 0; }
  .pm-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
  .pm-datetime { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 14px; color: var(--clay-dark); }
  .pm-level-badge {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 100px;
    background: var(--ball);
    color: var(--ink);
    white-space: nowrap;
    border: 1.5px solid var(--ink);
  }
  .pm-location { font-weight: 700; font-size: 15px; margin: 0 0 4px 0; }
  .pm-note { font-size: 13px; color: var(--ink-soft); margin: 0 0 10px 0; }
  .pm-players { font-size: 13px; color: var(--ink-soft); margin: 0 0 10px 0; }
  .pm-players b { color: var(--ink); }
  .pm-card-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pm-btn-join {
    background: var(--court);
    color: #fff;
    border: 2px solid var(--ink);
    font-weight: 800;
    font-size: 13px;
    padding: 9px 16px;
    border-radius: 100px;
    cursor: pointer;
    box-shadow: 2px 2px 0 var(--ink);
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
  }
  .pm-btn-join:hover { background: var(--court-dark); transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--ink); }
  .pm-btn-small {
    background: transparent;
    border: 2px solid var(--ink);
    color: var(--ink);
    font-size: 12px;
    font-weight: 700;
    padding: 8px 13px;
    border-radius: 100px;
    cursor: pointer;
  }
  .pm-btn-small.pm-leave { border-color: var(--danger); color: var(--danger); }
  .pm-tag-full {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 800;
    color: #fff;
    background: var(--clay);
    padding: 6px 12px;
    border-radius: 100px;
    border: 1.5px solid var(--ink);
  }
  .pm-tag-mine {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 10px;
    color: var(--ink);
    background: var(--ball);
    border: 1.5px solid var(--ink);
    padding: 3px 8px;
    border-radius: 100px;
  }

  /* ---------- Empty / loading ---------- */
  .pm-empty {
    text-align: center;
    padding: 48px 20px;
    color: var(--ink-soft);
  }
  .pm-empty .pm-display { font-size: 28px; color: var(--clay); margin-bottom: 8px; }
  .pm-loading { text-align: center; padding: 40px; color: var(--ink-soft); font-family: 'JetBrains Mono', monospace; font-size: 13px; }

  @media (max-width: 460px) {
    .pm-grid { grid-template-columns: 1fr; }
    .pm-card { flex-direction: column; }
    .pm-court-svg { width: 100px; height: 60px; align-self: flex-start; }
  }

  @media (prefers-reduced-motion: reduce) {
    #padelmatch-root * { animation: none !important; transition: none !important; }
  }
</style>

</head>
<body>
<div id="padelmatch-root">
  <div class="pm-hero">
    <svg class="pm-hero-lines" viewBox="0 0 720 220" preserveAspectRatio="none">
      <rect x="16" y="16" width="688" height="188" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <line x1="360" y1="16" x2="360" y2="204" stroke="#DFFF3D" stroke-width="4"/>
      <line x1="16" y1="110" x2="704" y2="110" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="10 8"/>
      <line x1="230" y1="16" x2="230" y2="204" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
      <line x1="490" y1="16" x2="490" y2="204" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
    </svg>
    <div class="pm-hero-inner">
      <p class="pm-eyebrow">Court Finder · Padel</p>
      <h1 class="pm-headline pm-display">Wer<br/>spielt?</h1>
      <div class="pm-net" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <p class="pm-sub">Trag dein Match ein, sag welches Level du suchst und wie viele Mitspieler noch fehlen. Andere Spieler:innen in der Nähe schließen sich direkt an.</p>
      <button class="pm-cta" id="pm-toggle-form">+ Spiel eintragen</button>
    </div>
  </div>

  <div class="pm-namebar">
    <div class="pm-namebar-inner">
      <label for="pm-name-input">Dein&nbsp;Name</label>
      <input id="pm-name-input" type="text" placeholder="z.B. Alex" maxlength="40" />
    </div>
  </div>

  <div class="pm-main">
    <div class="pm-form-wrap" id="pm-form-wrap">
      <form class="pm-form" id="pm-form">
        <h2>Neues Spiel</h2>
        <p class="pm-error" id="pm-form-error" style="display:none;"></p>
        <div class="pm-grid">
          <div class="pm-field">
            <label for="pm-date">Datum</label>
            <input type="date" id="pm-date" required />
          </div>
          <div class="pm-field">
            <label for="pm-time">Uhrzeit</label>
            <input type="time" id="pm-time" required />
          </div>
        </div>
        <div class="pm-field pm-full">
          <label for="pm-location">Ort / Platz</label>
          <input type="text" id="pm-location" placeholder="z.B. Padel Club Athen, Platz 2" required />
        </div>
        <div class="pm-field pm-full">
          <label>Level gesucht</label>
          <div class="pm-level-picker" id="pm-level-picker"></div>
        </div>
        <div class="pm-field">
          <label for="pm-players">Gesuchte Spieler</label>
          <select id="pm-players">
            <option value="1">1 Spieler</option>
            <option value="2">2 Spieler</option>
            <option value="3">3 Spieler</option>
          </select>
        </div>
        <div class="pm-field">
          <label for="pm-creator">Dein Name</label>
          <input type="text" id="pm-creator" placeholder="Wird oben übernommen" required />
        </div>
        <div class="pm-field pm-full">
          <label for="pm-note">Notiz (optional)</label>
          <textarea id="pm-note" placeholder="z.B. lockeres Match, Schläger vorhanden..."></textarea>
        </div>
        <div class="pm-form-actions">
          <button type="submit" class="pm-btn-primary">Spiel eintragen</button>
          <button type="button" class="pm-btn-ghost" id="pm-cancel-form">Abbrechen</button>
        </div>
      </form>
    </div>

    <div class="pm-filters" id="pm-filters"></div>

    <div id="pm-list-container">
      <div class="pm-loading">Spiele werden geladen …</div>
    </div>
  </div>
</div>

<script>
(function () {
  const LEVELS = [
    { key: 'anfaenger', label: 'Anfänger', short: 'LVL 1' },
    { key: 'mittel', label: 'Mittel', short: 'LVL 2' },
    { key: 'fortgeschritten', label: 'Fortgeschritten', short: 'LVL 3' },
    { key: 'profi', label: 'Profi', short: 'LVL 4' }
  ];
  const levelLabel = k => (LEVELS.find(l => l.key === k) || {}).label || k;
  const levelShort = k => (LEVELS.find(l => l.key === k) || {}).short || '';

  const root = document.getElementById('padelmatch-root');
  const nameInput = document.getElementById('pm-name-input');
  const creatorInput = document.getElementById('pm-creator');
  const formWrap = document.getElementById('pm-form-wrap');
  const form = document.getElementById('pm-form');
  const formError = document.getElementById('pm-form-error');
  const levelPicker = document.getElementById('pm-level-picker');
  const filtersEl = document.getElementById('pm-filters');
  const listContainer = document.getElementById('pm-list-container');

  let games = [];
  let activeFilter = 'alle';
  let selectedLevel = LEVELS[0].key;
  let myName = '';

  // ---------- storage helpers ----------
  async function loadName() {
    try {
      const res = await window.storage.get('padel-my-name', false);
      return res ? res.value : '';
    } catch (e) { return ''; }
  }
  async function saveName(name) {
    try { await window.storage.set('padel-my-name', name, false); } catch (e) {}
  }
  async function loadGames() {
    try {
      const res = await window.storage.get('padel-games', true);
      return res ? JSON.parse(res.value) : [];
    } catch (e) { return []; }
  }
  async function saveGames(list) {
    try {
      const res = await window.storage.set('padel-games', JSON.stringify(list), true);
      return !!res;
    } catch (e) { return false; }
  }

  // ---------- level picker ----------
  function renderLevelPicker() {
    levelPicker.innerHTML = '';
    LEVELS.forEach(l => {
      const opt = document.createElement('div');
      opt.className = 'pm-level-opt' + (l.key === selectedLevel ? ' pm-active' : '');
      opt.textContent = l.label;
      opt.addEventListener('click', () => { selectedLevel = l.key; renderLevelPicker(); });
      levelPicker.appendChild(opt);
    });
  }

  // ---------- filters ----------
  function renderFilters() {
    filtersEl.innerHTML = '';
    const options = [{ key: 'alle', label: 'Alle' }].concat(LEVELS.map(l => ({ key: l.key, label: l.label })));
    options.forEach(o => {
      const chip = document.createElement('div');
      chip.className = 'pm-chip' + (activeFilter === o.key ? ' pm-active' : '');
      chip.textContent = o.label;
      chip.addEventListener('click', () => { activeFilter = o.key; renderFilters(); renderList(); });
      filtersEl.appendChild(chip);
    });
  }

  // ---------- mini court svg ----------
  function courtSVG(totalSlots, filledCount) {
    const w = 84, h = 108;
    const dotsPerRow = Math.ceil(totalSlots / 2);
    const positions = [];
    for (let row = 0; row < 2; row++) {
      const count = row === 0 ? Math.ceil(totalSlots / 2) : Math.floor(totalSlots / 2);
      for (let i = 0; i < count; i++) {
        const x = (w / (count + 1)) * (i + 1);
        const y = row === 0 ? 30 : h - 30;
        positions.push([x, y]);
      }
    }
    let dots = '';
    positions.forEach((p, i) => {
      const filled = i < filledCount;
      dots += `<circle cx="${p[0]}" cy="${p[1]}" r="7.5" fill="${filled ? 'var(--ball)' : '#FFFFFF'}" stroke="var(--ink)" stroke-width="2"/>`;
    });
    return `<svg class="pm-court-svg" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
      <rect x="3" y="3" width="${w-6}" height="${h-6}" rx="7" fill="var(--court-bright)" stroke="var(--ink)" stroke-width="2"/>
      <rect x="10" y="10" width="${w-20}" height="${h-20}" rx="4" fill="none" stroke="var(--line)" stroke-width="2"/>
      <line x1="10" y1="${h/2}" x2="${w-10}" y2="${h/2}" stroke="var(--ball)" stroke-width="3"/>
      ${dots}
    </svg>`;
  }

  // ---------- date/time formatting ----------
  function fmtDate(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
  }
  function isPast(g) {
    const dt = new Date(g.date + 'T' + g.time);
    return dt.getTime() < Date.now() - 60 * 60 * 1000; // 1h grace period
  }

  // ---------- render list ----------
  function renderList() {
    let visible = games.filter(g => !isPast(g));
    if (activeFilter !== 'alle') visible = visible.filter(g => g.level === activeFilter);
    visible.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

    if (visible.length === 0) {
      listContainer.innerHTML = `
        <div class="pm-empty">
          <p class="pm-display">Noch keine Spiele in Sicht</p>
          <p>Leg als Erste:r los und trag ein Match ein.</p>
        </div>`;
      return;
    }

    listContainer.innerHTML = `<div class="pm-list" id="pm-list"></div>`;
    const listEl = document.getElementById('pm-list');

    visible.forEach((g, idx) => {
      const totalSlots = g.spotsNeeded + 1;
      const filledCount = 1 + g.joined.length;
      const remaining = g.spotsNeeded - g.joined.length;
      const isFull = remaining <= 0;
      const isMineCreator = myName && g.creator.toLowerCase() === myName.toLowerCase();
      const isMineJoined = myName && g.joined.some(n => n.toLowerCase() === myName.toLowerCase());

      const card = document.createElement('div');
      card.className = 'pm-card' + (isFull ? ' pm-full-game' : '');
      card.style.animationDelay = (idx * 0.04) + 's';

      let actionsHtml = '';
      if (isMineCreator) {
        actionsHtml = `<span class="pm-tag-mine">Dein Spiel</span><button class="pm-btn-small" data-action="delete" data-id="${g.id}">Löschen</button>`;
      } else if (isMineJoined) {
        actionsHtml = `<span class="pm-tag-mine">Dabei</span><button class="pm-btn-small pm-leave" data-action="leave" data-id="${g.id}">Verlassen</button>`;
      } else if (isFull) {
        actionsHtml = `<span class="pm-tag-full">Voll</span>`;
      } else {
        actionsHtml = `<button class="pm-btn-join" data-action="join" data-id="${g.id}">Mitspielen</button>`;
      }

      card.innerHTML = `
        ${courtSVG(totalSlots, filledCount)}
        <div class="pm-card-body">
          <div class="pm-card-top">
            <span class="pm-datetime">${fmtDate(g.date)} · ${g.time}</span>
            <span class="pm-level-badge">${levelShort(g.level)} · ${levelLabel(g.level)}</span>
          </div>
          <p class="pm-location">${escapeHtml(g.location)}</p>
          ${g.note ? `<p class="pm-note">${escapeHtml(g.note)}</p>` : ''}
          <p class="pm-players">${isFull ? '<b>Team komplett</b>' : `<b>${remaining}</b> von ${g.spotsNeeded} Plätzen frei`} · von ${escapeHtml(g.creator)}${g.joined.length ? ' · mit ' + g.joined.map(escapeHtml).join(', ') : ''}</p>
          <div class="pm-card-actions">${actionsHtml}</div>
        </div>`;
      listEl.appendChild(card);
    });

    listEl.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', () => handleAction(btn.dataset.action, btn.dataset.id));
    });
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }

  // ---------- actions ----------
  async function handleAction(action, id) {
    if (!myName) {
      nameInput.focus();
      nameInput.style.borderColor = 'var(--danger, #B5482F)';
      setTimeout(() => { nameInput.style.borderColor = ''; }, 1200);
      return;
    }
    const fresh = await loadGames();
    const g = fresh.find(x => x.id === id);
    if (!g) { games = fresh; renderList(); return; }

    if (action === 'join') {
      const remaining = g.spotsNeeded - g.joined.length;
      const already = g.creator.toLowerCase() === myName.toLowerCase() || g.joined.some(n => n.toLowerCase() === myName.toLowerCase());
      if (remaining > 0 && !already) g.joined.push(myName);
    } else if (action === 'leave') {
      g.joined = g.joined.filter(n => n.toLowerCase() !== myName.toLowerCase());
    } else if (action === 'delete') {
      if (g.creator.toLowerCase() === myName.toLowerCase()) {
        const updated = fresh.filter(x => x.id !== id);
        games = updated;
        await saveGames(updated);
        renderList();
        return;
      }
    }
    games = fresh;
    await saveGames(fresh);
    renderList();
  }

  // ---------- form ----------
  document.getElementById('pm-toggle-form').addEventListener('click', () => {
    formWrap.classList.add('pm-open');
    document.getElementById('pm-date').focus();
    window.scrollTo({ top: formWrap.getBoundingClientRect().top + window.scrollY - 20, behavior: 'smooth' });
  });
  document.getElementById('pm-cancel-form').addEventListener('click', () => {
    formWrap.classList.remove('pm-open');
    formError.style.display = 'none';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    formError.style.display = 'none';

    const date = document.getElementById('pm-date').value;
    const time = document.getElementById('pm-time').value;
    const location = document.getElementById('pm-location').value.trim();
    const spotsNeeded = parseInt(document.getElementById('pm-players').value, 10);
    const creator = document.getElementById('pm-creator').value.trim();
    const note = document.getElementById('pm-note').value.trim();

    if (!date || !time || !location || !creator) {
      formError.textContent = 'Bitte füll Datum, Uhrzeit, Ort und deinen Namen aus.';
      formError.style.display = 'block';
      return;
    }

    const submitBtn = form.querySelector('.pm-btn-primary');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Wird gespeichert …';

    const newGame = {
      id: 'g_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
      date, time, location,
      level: selectedLevel,
      spotsNeeded,
      creator,
      note,
      joined: [],
      createdAt: Date.now()
    };

    try {
      const fresh = await loadGames();
      fresh.push(newGame);
      const ok = await saveGames(fresh);
      if (!ok) throw new Error('save failed');
      games = fresh;
      myName = creator;
      nameInput.value = creator;
      await saveName(creator);
      form.reset();
      renderLevelPicker();
      formWrap.classList.remove('pm-open');
      renderList();
    } catch (err) {
      formError.textContent = 'Das hat leider nicht geklappt. Versuch es noch einmal.';
      formError.style.display = 'block';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Spiel eintragen';
    }
  });

  nameInput.addEventListener('change', async () => {
    myName = nameInput.value.trim();
    creatorInput.value = myName;
    await saveName(myName);
    renderList();
  });
  nameInput.addEventListener('input', () => {
    creatorInput.value = nameInput.value.trim();
  });

  // ---------- init ----------
  async function init() {
    renderLevelPicker();
    renderFilters();
    const todayStr = new Date().toISOString().slice(0, 10);
    document.getElementById('pm-date').min = todayStr;

    const [name, list] = await Promise.all([loadName(), loadGames()]);
    myName = name || '';
    nameInput.value = myName;
    creatorInput.value = myName;
    games = list;
    renderList();
  }

  init();
})();
</script>

  const originalTexts = new WeakMap();

  function detectLanguage() {
    const saved = localStorage.getItem("padel-language");
    if (saved) return saved;

    const lang = (navigator.language || "").toLowerCase();
    if (lang.startsWith("el")) return "el";
    if (lang.startsWith("de")) return "de";
    return "en";
  }

  let currentLanguage = detectLanguage();

  function translatePage() {
    document.documentElement.lang = currentLanguage;

    const walker = document.createTreeWalker(
      document.body,
      NodeFilter.SHOW_TEXT
    );

    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);

    nodes.forEach(node => {
      const parent = node.parentElement;
      if (!parent || parent.closest("#pm-language-switcher")) return;
      if (parent.tagName === "SCRIPT" || parent.tagName === "STYLE") return;

      if (!originalTexts.has(node)) {
        originalTexts.set(node, node.nodeValue);
      }

      const original = originalTexts.get(node);
      const trimmed = original.trim();

      if (translations[currentLanguage][trimmed]) {
        const leading = original.match(/^\s*/)[0];
        const trailing = original.match(/\s*$/)[0];

        node.nodeValue =
          leading +
          translations[currentLanguage][trimmed] +
          trailing;
      }
    });

    document.querySelectorAll("input, textarea").forEach(el => {
      if (!el.dataset.originalPlaceholder) {
        el.dataset.originalPlaceholder = el.placeholder || "";
      }

      const original = el.dataset.originalPlaceholder;
      if (translations[currentLanguage][original]) {
        el.placeholder = translations[currentLanguage][original];
      }
    });

    updateButtons();
  }

  function updateButtons() {
    document.querySelectorAll("#pm-language-switcher button").forEach(btn => {
      btn.style.background =
        btn.dataset.lang === currentLanguage ? "#DFFF3D" : "#FFFFFF";
    });
  }

  function createLanguageSwitcher() {
    const box = document.createElement("div");
    box.id = "pm-language-switcher";

    Object.assign(box.style, {
      position: "fixed",
      top: "100px",
      right: "12px",
      zIndex: "99999",
      display: "flex",
      gap: "5px",
      padding: "5px",
      background: "rgba(255,255,255,0.92)",
      border: "2px solid #06262C",
      borderRadius: "30px",
      boxShadow: "2px 2px 0 #06262C"
    });

    [
      ["de", "DE"],
      ["el", "ΕΛ"],
      ["en", "EN"]
    ].forEach(([lang, label]) => {
      const button = document.createElement("button");
      button.type = "button";
      button.dataset.lang = lang;
      button.textContent = label;

      Object.assign(button.style, {
        border: "0",
        borderRadius: "20px",
        padding: "7px 10px",
        fontWeight: "800",
        cursor: "pointer",
        color: "#06262C"
      });

      button.addEventListener("click", () => {
        currentLanguage = lang;
        localStorage.setItem("padel-language", lang);

        /* Seite neu laden, damit auch dynamische Inhalte sauber übersetzt werden */
        location.reload();
      });

      box.appendChild(button);
    });

    document.body.appendChild(box);
  }

  createLanguageSwitcher();

  setTimeout(translatePage, 100);

  const observer = new MutationObserver(() => {
    translatePage();
  });

  observer.observe(document.body, {
    childList: true,
    subtree: true
  });
})();
